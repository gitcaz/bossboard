<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6ef5">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com http://localhost:* http://127.0.0.1:*; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>BossBoard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head><body>
<header><h1>&#9632; BossBoard</h1>
<nav id="tabs"><button data-tab="next">Next Up</button><button data-tab="today">Today<span id="tcnt"></span></button><button data-tab="tasks">Tasks</button><button data-tab="projects">Projects</button><button data-tab="inventory">Inventory</button><button data-tab="activity">Activity</button></nav>
<span class="sp"></span>
<label class="small mut">acting as <select id="who"><option>user</option><option>boss</option><option>codex</option><option>claude</option></select></label>
<button class="ic" id="theme" title="toggle theme">&#9680;</button>
<button class="sync" id="sync" title="sync status - click to sync now"><span class="dot"></span><span id="synctxt">...</span></button>
<button class="ic" id="gear" title="Settings (repo &amp; token)" data-tab="settings">&#9881;</button>
</header>
<div id="banner"></div>
<main id="main"></main>
<dialog id="dlg"><form method="dialog" id="dform"><h2 id="dtitle"></h2><div id="dbody"></div>
<div class="acts"><button value="cancel" formnovalidate>Cancel</button><button class="pri" value="ok" id="dok">Save</button></div></form></dialog>
<div class="err" id="err"></div>
<script type="module" src="js/app.js"></script>
</body></html>
